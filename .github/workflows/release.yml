name: release

# Dispara ao empurrar uma tag de versão (ex.: v0.3.0). Compila o binário para várias plataformas
# e anexa os .tar.gz ao GitHub Release — pronto para instalar em outras máquinas.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest # ARM runner cross-compila p/ x86_64 (evita o escasso macos-13)
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path mcp/Cargo.toml
      - name: package
        run: |
          bin="mcp/target/${{ matrix.target }}/release/code-intel-mcp"
          tar -czf "code-intel-mcp-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" code-intel-mcp
      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: code-intel-mcp-${{ matrix.target }}.tar.gz
          generate_release_notes: true
