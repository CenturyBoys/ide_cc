[package]
name = "code-intel-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP fino e rápido sobre um language server (tsgo) com gate de warmup — POC 'IDE na mão da LLM'"

[[bin]]
name = "code-intel-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
