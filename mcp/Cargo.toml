[package]
name = "code-intel-mcp"
version = "0.7.6"
edition = "2021"
description = "MCP server for semantic code operations (rename/move/extract) over real language servers — 'an IDE in the LLM's hands'"
license = "MIT"
repository = "https://github.com/CenturyBoys/ide_cc"
readme = "../README.md"
keywords = ["mcp", "lsp", "refactoring", "code-intelligence", "claude"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "code-intel-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
