[package]
name = "code-intel-mcp"
version = "0.8.2"
edition = "2021"
description = "MCP server for semantic code operations (rename/move/extract) over real language servers — 'an IDE in the LLM's hands'"
license = "MIT"
repository = "https://github.com/CenturyBoys/ide_cc"
readme = "../README.md"
keywords = ["mcp", "lsp", "refactoring", "code-intelligence", "claude"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "code-intel-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# unix-only: double-fork + setsid para DESACOPLAR o daemon do proxy (reparenta ao init → nunca vira
# zombie de nenhum proxy; N4 cross-proxy da issue #4). Crate ubíqua, sem deps transitivas.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
