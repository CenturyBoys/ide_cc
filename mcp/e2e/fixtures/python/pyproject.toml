[project]
name = "e2e-fixture-python"
version = "0.0.0"

# Config de workspace do basedpyright — sem isto o find_references sai INCOMPLETO em silêncio
# (o achado crítico do relatório pachamama). O e2e valida que COM a config as refs resolvem.
[tool.basedpyright]
include = ["."]
# typeCheckingMode=off É A CONFIG QUE QUEBROU O P8: sem diagnósticos, o net_delta do rename fica
# inerte. Mantemos "off" DE PROPÓSITO — o caso adversarial de colisão prova que a rede independente
# de diagnósticos (detecção de colisão de escopo) pega o rename destrutivo mesmo assim.
typeCheckingMode = "off"
